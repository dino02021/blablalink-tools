name: nikke_pipeline

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Override account slug"
        required: false
        type: string

jobs:
  download_nikke_batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Prepare runtime directories
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          mkdir -p "$SETTINGS_DIR"
          mkdir -p data
      - name: Download Nikke info file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from lib.constants import NIKKES_INFO_URL

          data = urlopen(NIKKES_INFO_URL, timeout=30).read().decode("utf-8")
          Path("data/nikkes_info.json").write_text(data, encoding="utf-8")
          PY
      - name: Restore session file
        shell: bash
        env:
          BLABLALINK_SESSIONS_JSON: ${{ secrets.BLABLALINK_SESSIONS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_SESSIONS_JSON" > "$SETTINGS_DIR/sessions.json"
      - name: Restore members file
        shell: bash
        env:
          BLABLALINK_MEMBERS_JSON: ${{ secrets.BLABLALINK_MEMBERS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_MEMBERS_JSON" > "$SETTINGS_DIR/members_id.json"
      - name: Restore Nikke checklist file
        shell: bash
        env:
          BLABLALINK_NIKKE_CHECKLIST_NAME_CODES_JSON: ${{ secrets.BLABLALINK_NIKKE_CHECKLIST_NAME_CODES_JSON }}
        run: |
          printf '%s' "$BLABLALINK_NIKKE_CHECKLIST_NAME_CODES_JSON" > "data/nikke_checklist_name_codes.json"
      - name: Run Nikke batch download
        shell: bash
        env:
          BLABLALINK_DEFAULT_ACCOUNT: ${{ secrets.BLABLALINK_DEFAULT_ACCOUNT }}
        run: |
          ACCOUNT="${{ inputs.account }}"
          if [ -z "$ACCOUNT" ]; then ACCOUNT="$BLABLALINK_DEFAULT_ACCOUNT"; fi
          python -m lib.cli.run_job nikke-batch-download --account "$ACCOUNT"
