name: nikke_pipeline

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Override account slug"
        required: false
        type: string

jobs:
  nikke_batch_pipeline:
    runs-on: ubuntu-latest
    env:
      BLABLALINK_CLOUD_DATA_REPO: dino02021/BlaBlaLinkTool-data
      BLABLALINK_CLOUD_DATA_BRANCH: main
      BLABLALINK_CLOUD_DATA_TOKEN: ${{ secrets.BLABLALINK_CLOUD_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Prepare runtime directories
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          mkdir -p "$SETTINGS_DIR"
      - name: Restore session file
        shell: bash
        env:
          BLABLALINK_SESSIONS_JSON: ${{ secrets.BLABLALINK_SESSIONS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_SESSIONS_JSON" > "$SETTINGS_DIR/sessions.json"
      - name: Restore sheets file
        shell: bash
        env:
          BLABLALINK_SHEETS_JSON: ${{ secrets.BLABLALINK_SHEETS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_SHEETS_JSON" > "$SETTINGS_DIR/google_sheets_id.json"
      - name: Restore Google credentials file
        shell: bash
        env:
          BLABLALINK_GOOGLE_CREDENTIALS_JSON: ${{ secrets.BLABLALINK_GOOGLE_CREDENTIALS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_GOOGLE_CREDENTIALS_JSON" > "$SETTINGS_DIR/service_account.json"
      - name: Resolve account
        id: resolve_account
        shell: bash
        env:
          BLABLALINK_DEFAULT_ACCOUNT: ${{ secrets.BLABLALINK_DEFAULT_ACCOUNT }}
        run: |
          ACCOUNT="${{ inputs.account }}"
          if [ -z "$ACCOUNT" ]; then ACCOUNT="$BLABLALINK_DEFAULT_ACCOUNT"; fi
          if [ -z "$ACCOUNT" ]; then
            echo "Missing account" >&2
            exit 1
          fi
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Run Nikke batch download
        id: nikke_download
        shell: bash
        run: |
          python -m lib.cli.run_job --json nikke-batch-download --account "${{ steps.resolve_account.outputs.account }}" | tee nikke-download.log
          tail -n 1 nikke-download.log > nikke-download.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("nikke-download.json").read_text(encoding="utf-8"))
          if not payload.get("ok"):
              raise SystemExit(payload.get("message", "nikke-batch-download failed"))

          outputs = payload.get("outputs") or {}
          files = outputs.get("files") or []
          guild_id = str(outputs.get("guild_id", "") or "")

          with Path("nikke-download.outputs").open("w", encoding="utf-8") as handle:
              handle.write(f"files_json={json.dumps(files, ensure_ascii=False)}\n")
              handle.write(f"guild_id={guild_id}\n")
          PY
          cat nikke-download.outputs >> "$GITHUB_OUTPUT"
      - name: Run Nikke upload
        shell: bash
        run: |
          python -m lib.cli.run_job --json nikke-upload \
            --account "${{ steps.resolve_account.outputs.account }}" \
            --files-json '${{ steps.nikke_download.outputs.files_json }}'
