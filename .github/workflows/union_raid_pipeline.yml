name: union_raid_pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        type: choice
        default: download
        options:
          - download
          - full
      scope:
        description: "Account scope"
        required: true
        type: choice
        default: single
        options:
          - single
          - all
      account:
        description: "Override account slug"
        required: false
        type: string
      month:
        description: "Month text for upload, e.g. 2026/04"
        required: false
        type: string

jobs:
  download_union_raid:
    if: ${{ inputs.mode == 'download' || inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Prepare runtime directories
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          mkdir -p "$SETTINGS_DIR"
      - name: Restore session file
        shell: bash
        env:
          BLABLALINK_SESSIONS_JSON: ${{ secrets.BLABLALINK_SESSIONS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_SESSIONS_JSON" > "$SETTINGS_DIR/sessions.json"
      - name: Run union raid download
        if: ${{ inputs.mode == 'download' }}
        shell: bash
        env:
          BLABLALINK_DEFAULT_ACCOUNT: ${{ secrets.BLABLALINK_DEFAULT_ACCOUNT }}
          BLABLALINK_UNION_ACCOUNT_MAP_JSON: ${{ secrets.BLABLALINK_UNION_ACCOUNT_MAP_JSON }}
        run: |
          python -m lib.cli.run_job union-raid-pipeline --mode download --scope "${{ inputs.scope }}" --account "${{ inputs.account }}" --json
      - name: Restore Google credentials file
        if: ${{ inputs.mode == 'full' }}
        shell: bash
        env:
          BLABLALINK_GOOGLE_CREDENTIALS_JSON: ${{ secrets.BLABLALINK_GOOGLE_CREDENTIALS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_GOOGLE_CREDENTIALS_JSON" > "$SETTINGS_DIR/service_account.json"
      - name: Restore union sheet mapping
        if: ${{ inputs.mode == 'full' }}
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          cp ".github/runtime/union_google_sheets_id.json" "$SETTINGS_DIR/google_sheets_id.json"
      - name: Run union raid full pipeline
        if: ${{ inputs.mode == 'full' }}
        shell: bash
        env:
          BLABLALINK_DEFAULT_ACCOUNT: ${{ secrets.BLABLALINK_DEFAULT_ACCOUNT }}
          BLABLALINK_UNION_ACCOUNT_MAP_JSON: ${{ secrets.BLABLALINK_UNION_ACCOUNT_MAP_JSON }}
          BLABLALINK_STRICT_UNION_WEBAPP: "1"
        run: |
          python -m lib.cli.run_job union-raid-pipeline --mode full --scope "${{ inputs.scope }}" --account "${{ inputs.account }}" --month "${{ inputs.month }}" --json
