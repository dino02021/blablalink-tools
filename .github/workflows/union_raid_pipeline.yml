name: union_raid_pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        type: choice
        default: full
        options:
          - download
          - full
      account:
        description: "Override account slug"
        required: false
        type: string
      month:
        description: "Month text for upload, e.g. 2026/04"
        required: false
        type: string

jobs:
  download_union_raid:
    if: ${{ inputs.mode == 'download' || inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.account.outputs.account }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Prepare runtime directories
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          mkdir -p "$SETTINGS_DIR"
      - name: Resolve account slug
        id: account
        shell: bash
        env:
          BLABLALINK_DEFAULT_ACCOUNT: ${{ secrets.BLABLALINK_DEFAULT_ACCOUNT }}
        run: |
          ACCOUNT="${{ inputs.account }}"
          if [ -z "$ACCOUNT" ]; then ACCOUNT="$BLABLALINK_DEFAULT_ACCOUNT"; fi
          printf 'account=%s\n' "$ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Restore session file
        shell: bash
        env:
          BLABLALINK_SESSIONS_JSON: ${{ secrets.BLABLALINK_SESSIONS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_SESSIONS_JSON" > "$SETTINGS_DIR/sessions.json"
      - name: Run union raid download
        shell: bash
        run: |
          python -m lib.cli.run_job union-raid-download --account "${{ steps.account.outputs.account }}"
      - name: Detect union artifact path
        id: union_path
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from lib.constants import UNION_RAID_TEMP_FILE
          print(f"path={UNION_RAID_TEMP_FILE.parent}")
          PY
      - name: Upload session artifact
        if: ${{ inputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: union-runtime-settings
          path: /home/runner/Documents/BlablalinkToolSettings/sessions.json
          retention-days: 1
      - name: Upload union artifact
        if: ${{ inputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: union-raid-data
          path: ${{ steps.union_path.outputs.path }}
          retention-days: 1

  upload_union_raid:
    if: ${{ inputs.mode == 'full' }}
    needs: download_union_raid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Prepare runtime directories
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          mkdir -p "$SETTINGS_DIR"
      - name: Restore sheets file
        shell: bash
        env:
          BLABLALINK_SHEETS_JSON: ${{ secrets.BLABLALINK_SHEETS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_SHEETS_JSON" > "$SETTINGS_DIR/google_sheets_id.json"
      - name: Restore Google credentials file
        shell: bash
        env:
          BLABLALINK_GOOGLE_CREDENTIALS_JSON: ${{ secrets.BLABLALINK_GOOGLE_CREDENTIALS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_GOOGLE_CREDENTIALS_JSON" > "$SETTINGS_DIR/service_account.json"
      - name: Detect union artifact path
        id: union_path
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from lib.constants import UNION_RAID_TEMP_FILE
          print(f"path={UNION_RAID_TEMP_FILE.parent}")
          PY
      - name: Download session artifact
        uses: actions/download-artifact@v4
        with:
          name: union-runtime-settings
          path: /home/runner/Documents/BlablalinkToolSettings
      - name: Download union artifact
        uses: actions/download-artifact@v4
        with:
          name: union-raid-data
          path: ${{ steps.union_path.outputs.path }}
      - name: Run union raid upload
        shell: bash
        run: |
          python -m lib.cli.run_job union-raid-upload --account "${{ needs.download_union_raid.outputs.account }}" --month "${{ inputs.month }}"
