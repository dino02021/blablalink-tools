name: union_raid_pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        type: choice
        default: download
        options:
          - download
          - full
      account:
        description: "Override account slug"
        required: false
        type: string
      month:
        description: "Month text for upload, e.g. 2026/04"
        required: false
        type: string

jobs:
  download_union_raid:
    if: ${{ inputs.mode == 'download' || inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Prepare runtime directories
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          mkdir -p "$SETTINGS_DIR"
      - name: Resolve account slug
        id: account
        shell: bash
        env:
          BLABLALINK_DEFAULT_ACCOUNT: ${{ secrets.BLABLALINK_DEFAULT_ACCOUNT }}
        run: |
          ACCOUNT="${{ inputs.account }}"
          if [ -z "$ACCOUNT" ]; then ACCOUNT="$BLABLALINK_DEFAULT_ACCOUNT"; fi
          printf 'account=%s\n' "$ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Restore session file
        shell: bash
        env:
          BLABLALINK_SESSIONS_JSON: ${{ secrets.BLABLALINK_SESSIONS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_SESSIONS_JSON" > "$SETTINGS_DIR/sessions.json"
      - name: Run union raid download
        shell: bash
        run: |
          python -m lib.cli.run_job union-raid-download --account "${{ steps.account.outputs.account }}"
      - name: Restore Google credentials file
        if: ${{ inputs.mode == 'full' }}
        shell: bash
        env:
          BLABLALINK_GOOGLE_CREDENTIALS_JSON: ${{ secrets.BLABLALINK_GOOGLE_CREDENTIALS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_GOOGLE_CREDENTIALS_JSON" > "$SETTINGS_DIR/service_account.json"
      - name: Restore union sheet mapping
        if: ${{ inputs.mode == 'full' }}
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          cp ".github/runtime/union_google_sheets_id.json" "$SETTINGS_DIR/google_sheets_id.json"
      - name: Download Nikke info file
        if: ${{ inputs.mode == 'full' }}
        shell: bash
        run: |
          mkdir -p data
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from lib.constants import NIKKES_INFO_URL

          data = urlopen(NIKKES_INFO_URL, timeout=30).read().decode("utf-8")
          Path("data/nikkes_info.json").write_text(data, encoding="utf-8")
          PY
      - name: Resolve upload month
        if: ${{ inputs.mode == 'full' }}
        id: upload_month
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          import gspread
          from google.oauth2.service_account import Credentials

          from lib.jobs.union_raid_upload import resolve_union_sheet_target

          month = "${{ inputs.month }}".strip()
          if month:
              print(f"month={month}")
              raise SystemExit

          _union_id, sheet_id, _sheet_name = resolve_union_sheet_target()
          settings = Path.home() / "Documents" / "BlablalinkToolSettings"
          creds = json.loads((settings / "service_account.json").read_text(encoding="utf-8"))
          scopes = ["https://www.googleapis.com/auth/spreadsheets"]
          client = gspread.authorize(Credentials.from_service_account_info(creds, scopes=scopes))
          sh = client.open_by_key(sheet_id)

          months = []
          seen = set()
          for ws in sh.worksheets():
              title = str(ws.title).strip()
              match = re.match(r"^(\d{4}/\d{2})", title)
              if not match:
                  continue
              value = match.group(1)
              if value in seen:
                  continue
              seen.add(value)
              months.append(value)

          if not months:
              raise SystemExit("No upload month found in target spreadsheet")

          months.sort(reverse=True)
          print(f"month={months[0]}")
          PY
      - name: Run union raid upload
        if: ${{ inputs.mode == 'full' }}
        shell: bash
        env:
          BLABLALINK_STRICT_UNION_WEBAPP: "1"
        run: |
          python -m lib.cli.run_job union-raid-upload --account "${{ steps.account.outputs.account }}" --month "${{ steps.upload_month.outputs.month }}"
