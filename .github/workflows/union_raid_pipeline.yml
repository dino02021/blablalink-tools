name: union_raid_pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        type: choice
        default: download
        options:
          - download
          - full
      account:
        description: "Override account slug"
        required: false
        type: string
      month:
        description: "Month text for upload, e.g. 2026/04"
        required: false
        type: string

jobs:
  download_union_raid:
    if: ${{ inputs.mode == 'download' || inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Prepare runtime directories
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          mkdir -p "$SETTINGS_DIR"
      - name: Resolve account slug
        id: account
        shell: bash
        env:
          BLABLALINK_DEFAULT_ACCOUNT: ${{ secrets.BLABLALINK_DEFAULT_ACCOUNT }}
        run: |
          ACCOUNT="${{ inputs.account }}"
          if [ -z "$ACCOUNT" ]; then ACCOUNT="$BLABLALINK_DEFAULT_ACCOUNT"; fi
          printf 'account=%s\n' "$ACCOUNT" >> "$GITHUB_OUTPUT"
      - name: Restore session file
        shell: bash
        env:
          BLABLALINK_SESSIONS_JSON: ${{ secrets.BLABLALINK_SESSIONS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_SESSIONS_JSON" > "$SETTINGS_DIR/sessions.json"
      - name: Run union raid download
        shell: bash
        run: |
          python -m lib.cli.run_job union-raid-download --account "${{ steps.account.outputs.account }}"

  full_mode_unavailable:
    if: ${{ inputs.mode == 'full' }}
    needs: download_union_raid
    runs-on: ubuntu-latest
    steps:
      - name: Explain current limitation
        shell: bash
        run: |
          echo "Full mode is temporarily disabled in GitHub Actions."
          echo "Reason: the upload path still triggers Actions startup_failure when the workflow references sheet configuration secrets."
          echo "Month input received: '${{ inputs.month }}'"
          exit 1
