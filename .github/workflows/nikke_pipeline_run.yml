name: nikke_pipeline

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Override account slug"
        required: false
        type: string

jobs:
  nikke_batch_pipeline:
    runs-on: ubuntu-latest
    env:
      BLABLALINK_CLOUD_DATA_REPO: dino02021/BlaBlaLinkTool-data
      BLABLALINK_CLOUD_DATA_BRANCH: main
      BLABLALINK_CLOUD_DATA_TOKEN: ${{ secrets.BLABLALINK_CLOUD_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Prepare runtime directories
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          mkdir -p "$SETTINGS_DIR"
      - name: Restore session file
        shell: bash
        env:
          BLABLALINK_SESSIONS_JSON: ${{ secrets.BLABLALINK_SESSIONS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_SESSIONS_JSON" > "$SETTINGS_DIR/sessions.json"
      - name: Restore nikke sheet mapping
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          cp ".github/runtime/nikke_google_sheets_id.json" "$SETTINGS_DIR/google_sheets_id.json"
      - name: Restore Google credentials file
        shell: bash
        env:
          BLABLALINK_GOOGLE_CREDENTIALS_JSON: ${{ secrets.BLABLALINK_GOOGLE_CREDENTIALS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_GOOGLE_CREDENTIALS_JSON" > "$SETTINGS_DIR/service_account.json"
      - name: Run Nikke pipeline
        shell: bash
        env:
          BLABLALINK_DEFAULT_ACCOUNT: ${{ secrets.BLABLALINK_DEFAULT_ACCOUNT }}
        run: |
          ACCOUNT="${{ inputs.account }}"
          if [ -z "$ACCOUNT" ]; then ACCOUNT="$BLABLALINK_DEFAULT_ACCOUNT"; fi
          if [ -z "$ACCOUNT" ]; then
            echo "Missing account" >&2
            exit 1
          fi
          python -m lib.cli.run_job --json nikke-pipeline --account "$ACCOUNT"
