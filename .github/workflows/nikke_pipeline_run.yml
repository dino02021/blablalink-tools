name: nikke_pipeline

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Account scope"
        required: true
        type: choice
        default: all
        options:
          - single
          - all
      account:
        description: "Override account slug"
        required: false
        type: string

jobs:
  nikke_batch_pipeline:
    runs-on: ubuntu-latest
    env:
      BLABLALINK_CLOUD_DATA_REPO: dino02021/BlaBlaLinkTool-data
      BLABLALINK_CLOUD_DATA_BRANCH: main
      BLABLALINK_CLOUD_DATA_TOKEN: ${{ secrets.BLABLALINK_CLOUD_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Prepare runtime directories
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          mkdir -p "$SETTINGS_DIR"
      - name: Restore session file
        shell: bash
        env:
          BLABLALINK_SESSIONS_JSON: ${{ secrets.BLABLALINK_SESSIONS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_SESSIONS_JSON" > "$SETTINGS_DIR/sessions.json"
      - name: Restore union account map
        if: ${{ github.event_name == 'schedule' || inputs.scope == 'all' }}
        shell: bash
        env:
          BLABLALINK_UNION_ACCOUNT_MAP_JSON: ${{ secrets.BLABLALINK_UNION_ACCOUNT_MAP_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          SETTINGS_DIR="$SETTINGS_DIR" python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("BLABLALINK_UNION_ACCOUNT_MAP_JSON", "").strip()
          if not raw:
              raise SystemExit("Missing BLABLALINK_UNION_ACCOUNT_MAP_JSON")

          try:
              data = json.loads(raw)
          except Exception:
              data = json.loads(base64.b64decode(raw.encode("utf-8"), validate=True).decode("utf-8"))

          path = Path(os.environ["SETTINGS_DIR"]) / "union_account_map.json"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Restore nikke sheet mapping
        shell: bash
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          cp ".github/runtime/nikke_google_sheets_id.json" "$SETTINGS_DIR/google_sheets_id.json"
      - name: Restore Google credentials file
        shell: bash
        env:
          BLABLALINK_GOOGLE_CREDENTIALS_JSON: ${{ secrets.BLABLALINK_GOOGLE_CREDENTIALS_JSON }}
        run: |
          SETTINGS_DIR="$HOME/Documents/BlablalinkToolSettings"
          printf '%s' "$BLABLALINK_GOOGLE_CREDENTIALS_JSON" > "$SETTINGS_DIR/service_account.json"
      - name: Run Nikke pipeline
        shell: bash
        env:
          BLABLALINK_DEFAULT_ACCOUNT: ${{ secrets.BLABLALINK_DEFAULT_ACCOUNT }}
          BLABLALINK_UNION_ACCOUNT_MAP_JSON: ${{ secrets.BLABLALINK_UNION_ACCOUNT_MAP_JSON }}
        run: |
          ACCOUNT="${{ inputs.account }}"
          SCOPE="${{ github.event_name == 'schedule' && 'all' || inputs.scope }}"
          if [ -z "$SCOPE" ]; then SCOPE="all"; fi
          if [ "$SCOPE" = "single" ] && [ -z "$ACCOUNT" ]; then ACCOUNT="$BLABLALINK_DEFAULT_ACCOUNT"; fi
          if [ "$SCOPE" = "single" ] && [ -z "$ACCOUNT" ]; then
            echo "Missing account" >&2
            exit 1
          fi
          python -m lib.cli.run_job --json nikke-pipeline --scope "$SCOPE" --account "$ACCOUNT"
