name: Deploy Cloudflare Scheduler

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-scheduler/**'
      - '.github/workflows/deploy-cloudflare-scheduler.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: ./cloudflare-scheduler
      - run: npx wrangler deploy
        working-directory: ./cloudflare-scheduler
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: dino0202@gmail.com
          CLOUDFLARE_ACCOUNT_ID: 1686d5441104846eb27dddca026821a1

