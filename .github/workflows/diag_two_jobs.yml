name: diag_two_jobs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        type: choice
        default: download
        options:
          - download
          - full

jobs:
  first:
    if: ${{ inputs.mode == 'download' || inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: First
        run: echo first

  second:
    if: ${{ inputs.mode == 'full' }}
    needs: first
    runs-on: ubuntu-latest
    steps:
      - name: Second
        run: echo second
